name: Source resource-flow and exact-number contracts

on:
  pull_request:
    paths:
      - 'src/resource-flow.mjs'
      - 'src/resource-measurement.mjs'
      - 'src/graded.mjs'
      - 'src/exact-number.mjs'
      - 'src/rational-matrix.mjs'
      - 'src/utc-windows.mjs'
      - 'test/**'
      - 'package.json'
      - 'scripts/assay-resource-flow-package.mjs'
      - '.github/workflows/resource-flow-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/resource-flow.mjs'
      - 'src/resource-measurement.mjs'
      - 'src/graded.mjs'
      - 'src/exact-number.mjs'
      - 'src/rational-matrix.mjs'
      - 'src/utc-windows.mjs'
      - 'test/**'
      - 'package.json'
      - 'scripts/assay-resource-flow-package.mjs'
      - '.github/workflows/resource-flow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-resource-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify source syntax and exact resource measurement/flow tests
        run: |
          node --check src/resource-flow.mjs
          node --test test/resource-flow.test.mjs test/resource-measurement.test.mjs
      - name: Verify complete dependency-free exact-number package contracts
        run: npm test
      - name: Fabricate twice and receive original packed resource-flow API in an isolated consumer
        run: node scripts/assay-resource-flow-package.mjs
